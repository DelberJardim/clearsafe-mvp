name: Verify read-only MVP
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/safe_scanner
      - run: flutter analyze
      - run: flutter test
      - run: dart test && dart analyze
        working-directory: packages/safe_scanner
      - run: python3 tool/check_safety.py
      - run: flutter build apk --debug
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign

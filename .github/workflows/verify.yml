name: Verify ClearSafe safety and recovery
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/safe_scanner
      - run: flutter analyze
      - run: flutter test
      - run: dart test && dart analyze
        working-directory: packages/safe_scanner
      - run: python3 tool/check_safety.py
      - run: flutter build apk --debug
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest
        working-directory: android
      - name: Enable KVM for Android recovery tests
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            cd android
            result=0
            ./gradlew :app:connectedDebugAndroidTest || result=$?
            adb logcat -d > ../build/recovery-logcat.txt
            exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            build/app/reports
            build/recovery-logcat.txt

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign
